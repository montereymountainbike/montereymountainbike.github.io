<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MMB Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0ebe0;min-height:100vh;}

#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#3d2b1a;padding:24px;}
.logo{font-size:48px;margin-bottom:8px;}
.login-title{color:#c8a86a;font-size:20px;font-weight:700;letter-spacing:2px;margin-bottom:4px;}
.login-sub{color:#8b6340;font-size:12px;margin-bottom:28px;}
.login-card{background:#faf6f0;border-radius:16px;padding:24px;width:100%;max-width:320px;}
.login-card input{width:100%;padding:13px;border:1.5px solid #d4b896;border-radius:10px;font-size:15px;margin-bottom:14px;outline:none;color:#3d2b1a;background:#fff;}
.login-card button{width:100%;padding:13px;background:#3d2b1a;color:#c8a86a;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:2px;}
.err{color:#e74c3c;font-size:12px;text-align:center;margin-top:8px;display:none;}

#app{display:none;}
.topbar{background:#3d2b1a;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;}
.topbar h1{color:#c8a86a;font-size:16px;font-weight:700;}
.topbar-btns{display:flex;gap:8px;}
.btn-refresh{background:#c8a86a;color:#3d2b1a;border:none;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-logout{background:none;color:#8b6340;border:1px solid #5a3d1e;padding:7px 12px;border-radius:20px;font-size:12px;cursor:pointer;}

/* STATS BAR */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;}
.stat-box{background:white;border-radius:12px;padding:12px 6px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.stat-box .num{font-size:26px;font-weight:800;}
.stat-box .lbl{font-size:9px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.stat-box.today .num{color:#e67e22;}
.stat-box.upcoming .num{color:#27ae60;}
.stat-box.past-s .num{color:#888;}
.stat-box.total .num{color:#c8a86a;}

/* AVAILABLE SLOTS */
.slots-section{margin:0 12px 12px;background:white;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.slots-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#8b6340;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.slots-grid{display:flex;flex-wrap:wrap;gap:6px;}
.slot{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;}
.slot.available{background:#d4f4e2;color:#27ae60;}
.slot.booked{background:#fde9d4;color:#e67e22;text-decoration:line-through;}

/* TABS */
.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;background:#e8e0d0;color:#8b6340;flex-shrink:0;}
.tab.active{background:#3d2b1a;color:#c8a86a;}

/* CARDS */
.content{padding:0 12px;}
.sec-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#b09070;margin:10px 0 8px;display:flex;align-items:center;gap:8px;}
.badge{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;}
.b-orange{background:#fde9d4;color:#e67e22;}
.b-green{background:#d4f4e2;color:#27ae60;}
.b-blue{background:#d4e8f4;color:#2980b9;}
.b-gray{background:#eee;color:#999;}
.b-gold{background:#fdf3dc;color:#c8a86a;}

.card{background:white;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.07);}
.card.today-c{border-left:5px solid #e67e22;}
.card.tomorrow-c{border-left:5px solid #27ae60;}
.card.week-c{border-left:5px solid #2980b9;}
.card.past-c{border-left:5px solid #ccc;opacity:0.7;}
.card.new-c{border-left:5px solid #c8a86a;}

.card-name{font-size:17px;font-weight:800;color:#3d2b1a;margin-bottom:10px;}

.info-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.info-box{background:#faf6f0;border-radius:8px;padding:9px 11px;}
.info-lbl{font-size:9px;color:#b09070;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:3px;}
.info-val{font-size:13px;color:#3d2b1a;font-weight:700;}

.timing-bar{background:#3d2b1a;border-radius:10px;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.t-block{text-align:center;}
.t-lbl{font-size:9px;color:#8b6340;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.t-val{font-size:15px;font-weight:800;color:#c8a86a;}
.t-arrow{color:#c8a86a;font-size:20px;font-weight:300;}

.msg-box{background:#fdf8f0;border:1px solid #e8d8b8;border-radius:8px;padding:10px;font-size:12px;color:#8b6340;font-style:italic;margin-bottom:10px;line-height:1.5;}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.act{padding:9px 4px;border-radius:9px;font-size:11px;font-weight:700;border:none;cursor:pointer;text-align:center;text-decoration:none;display:block;}
.act-call{background:#d4f4e2;color:#27ae60;}
.act-email{background:#fdf3dc;color:#8b6340;}
.act-wa{background:#e8f8f0;color:#128C7E;}

.empty{text-align:center;padding:40px;color:#c4a882;}
.spin{width:30px;height:30px;border:3px solid #e8d8b8;border-top-color:#8b6340;border-radius:50%;animation:spin 0.7s linear infinite;margin:30px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.updated{text-align:center;font-size:10px;color:#c4a882;padding:8px 0 60px;}
</style>
</head>
<body>

<div id="login">
  <div class="logo">🚲</div>
  <div class="login-title">MONTEREY MOUNTAIN BIKE</div>
  <div class="login-sub">Bookings Dashboard</div>
  <div class="login-card">
    <input type="password" id="pwd" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button onclick="doLogin()">SIGN IN</button>
    <div class="err" id="err">Wrong password!</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>🚲 MMB Bookings</h1>
    <div class="topbar-btns">
      <button class="btn-refresh" onclick="loadData()">↻</button>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-box today"><div class="num" id="s-today">0</div><div class="lbl">Today</div></div>
    <div class="stat-box upcoming"><div class="num" id="s-up">0</div><div class="lbl">Upcoming</div></div>
    <div class="stat-box past-s"><div class="num" id="s-past">0</div><div class="lbl">Past</div></div>
    <div class="stat-box total"><div class="num" id="s-total">0</div><div class="lbl">Total</div></div>
  </div>

  <!-- Available slots today -->
  <div class="slots-section">
    <div class="slots-title">⏰ Today's Available Time Slots</div>
    <div class="slots-grid" id="slots-grid"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="setTab('all',this)">All</button>
    <button class="tab" onclick="setTab('today',this)">Today</button>
    <button class="tab" onclick="setTab('tomorrow',this)">Tomorrow</button>
    <button class="tab" onclick="setTab('week',this)">This Week</button>
    <button class="tab" onclick="setTab('upcoming',this)">Upcoming</button>
    <button class="tab" onclick="setTab('past',this)">Past</button>
  </div>

  <div class="content" id="content"><div class="spin"></div></div>
  <div class="updated" id="updated"></div>
</div>

<script>
const PASS = 'mmb2026';
const API = 'https://sheetdb.io/api/v1/5vp0mvc7l9ke9?sheet=Sheet1';
const ALL_SLOTS = ['8:00 AM','9:00 AM','10:00 AM','11:00 AM','12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM'];
let data = [], curTab = 'all';

function doLogin() {
  if (document.getElementById('pwd').value === PASS) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pwd').value = '';
  }
}

function doLogout() {
  document.getElementById('login').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('pwd').value = '';
}

function getVal(b, ...keys) {
  for (var k of keys) {
    var v = b[k] || b[k.toLowerCase()] || b[k.replace(/ /g,'_')];
    if (v && v.trim && v.trim() !== '' && v.trim() !== '-') return v.trim();
  }
  return '';
}

function getRideDate(b) {
  var s = getVal(b, 'Ride Date', 'ride_date', 'Booked on', 'Date');
  if (!s || s === 'Not specified') return null;
  var d = new Date(s);
  if (!isNaN(d)) return d;
  var p = s.split('/');
  if (p.length >= 3) return new Date(p[2].split(',')[0], p[0]-1, p[1]);
  return null;
}

function sod(d) { var x = new Date(d); x.setHours(0,0,0,0); return x; }

function classify(b) {
  var d = getRideDate(b);
  if (!d) return 'new';
  var diff = Math.round((sod(d) - sod(new Date())) / 86400000);
  if (diff === 0) return 'today';
  if (diff === 1) return 'tomorrow';
  if (diff > 1 && diff <= 7) return 'week';
  if (diff > 7) return 'upcoming';
  return 'past';
}

function loadData() {
  document.getElementById('content').innerHTML = '<div class="spin"></div>';
  fetch(API).then(r => r.json()).then(rows => {
    data = Array.isArray(rows) ? rows.reverse() : [];
    updateStats();
    updateSlots();
    render(curTab);
    document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  }).catch(() => {
    document.getElementById('content').innerHTML = '<div class="empty">⚠️ Could not load. Check connection.</div>';
  });
}

function updateStats() {
  var counts = {today:0, upcoming:0, past:0};
  data.forEach(b => {
    var c = classify(b);
    if (c === 'today') counts.today++;
    if (['tomorrow','week','upcoming'].includes(c)) counts.upcoming++;
    if (c === 'past') counts.past++;
  });
  document.getElementById('s-today').textContent = counts.today;
  document.getElementById('s-up').textContent = counts.upcoming;
  document.getElementById('s-past').textContent = counts.past;
  document.getElementById('s-total').textContent = data.length;
}

function updateSlots() {
  // Get today's booked pickup times
  var bookedSlots = data
    .filter(b => classify(b) === 'today')
    .map(b => getVal(b, 'Pickup Time', 'pickup_time', 'pickupTime').toUpperCase());

  var html = ALL_SLOTS.map(slot => {
    var booked = bookedSlots.some(s => s.includes(slot.replace(' ', '').toUpperCase()) || slot.toUpperCase().includes(s));
    return '<span class="slot ' + (booked ? 'booked' : 'available') + '">' + slot + (booked ? ' ✗' : ' ✓') + '</span>';
  }).join('');
  document.getElementById('slots-grid').innerHTML = html;
}

function setTab(tab, btn) {
  curTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render(tab);
}

function render(tab) {
  var groups = {today:[], tomorrow:[], week:[], upcoming:[], past:[], new:[]};
  data.forEach(b => groups[classify(b)].push(b));

  var html = '';

  function sec(title, items, cls, badgeCls) {
    if (!items.length) return '';
    var s = '<div class="sec-head">' + title + ' <span class="badge ' + badgeCls + '">' + items.length + '</span></div>';
    items.forEach(b => s += card(b, cls));
    return s;
  }

  if (tab==='all'||tab==='today')    html += sec('Today',    groups.today,    'today-c',    'b-orange');
  if (tab==='all'||tab==='tomorrow') html += sec('Tomorrow', groups.tomorrow, 'tomorrow-c', 'b-green');
  if (tab==='all'||tab==='week')     html += sec('This Week',groups.week,     'week-c',     'b-blue');
  if (tab==='all'||tab==='upcoming') html += sec('Upcoming', groups.upcoming, 'week-c',     'b-blue');
  if (tab==='all')                   html += sec('New (No Date)', groups.new, 'new-c',      'b-gold');
  if (tab==='all'||tab==='past')     html += sec('Past',     groups.past,     'past-c',     'b-gray');

  document.getElementById('content').innerHTML = html || '<div class="empty">📋 No bookings here</div>';
}

function card(b, cls) {
  var name    = getVal(b,'Name') || 'No Name Provided';
  var phone   = getVal(b,'Phone') || '-';
  var email   = getVal(b,'Email') || '-';
  var service = getVal(b,'Service') || '-';
  var pickup  = getVal(b,'Pickup Time','pickup_time','pickupTime') || '-';
  var dropoff = getVal(b,'Dropoff Time','dropoff_time','dropoffTime') || '-';
  var msg     = getVal(b,'Message') || '';
  var rideDate= getRideDate(b);
  var rdStr   = rideDate ? rideDate.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}) : 'Not set';
  var ph      = phone.replace(/\D/g,'');

  return '<div class="card ' + cls + '">' +
    '<div class="card-name">👤 ' + name + '</div>' +
    '<div class="info-row">' +
      '<div class="info-box"><div class="info-lbl">📞 Contact</div><div class="info-val">' + phone + '</div></div>' +
      '<div class="info-box"><div class="info-lbl">🚲 Service</div><div class="info-val">' + service + '</div></div>' +
      '<div class="info-box"><div class="info-lbl">📅 Ride Date</div><div class="info-val" style="font-size:11px">' + rdStr + '</div></div>' +
      '<div class="info-box"><div class="info-lbl">✉️ Email</div><div class="info-val" style="font-size:10px">' + email + '</div></div>' +
    '</div>' +
    '<div class="timing-bar">' +
      '<div class="t-block"><div class="t-lbl">🕐 Pickup</div><div class="t-val">' + pickup + '</div></div>' +
      '<div class="t-arrow">→</div>' +
      '<div class="t-block"><div class="t-lbl">🕐 Dropoff</div><div class="t-val">' + dropoff + '</div></div>' +
    '</div>' +
    (msg ? '<div class="msg-box">💬 ' + msg + '</div>' : '') +
    '<div class="actions">' +
      '<a href="tel:' + ph + '" class="act act-call">📞 Call</a>' +
      '<a href="mailto:' + email + '" class="act act-email">✉️ Email</a>' +
      '<a href="https://wa.me/1' + ph + '" class="act act-wa">💬 WhatsApp</a>' +
    '</div>' +
  '</div>';
}

setInterval(() => { if(document.getElementById('app').style.display!=='none') loadData(); }, 120000);
</script>
</body>
</html>
